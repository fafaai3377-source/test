<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; background: #0B0C0E; }
    * { box-sizing: border-box; }
    a { color: #FFB43D; text-decoration: none; }
    a:hover { color: #FFCE7A; }
    input { font-family: inherit; }
    input::placeholder { color: #565B64; }
    input:focus { outline: none; box-shadow: 0 0 0 3px rgba(255, 180, 61, 0.16); }
    button { font-family: inherit; cursor: pointer; border: none; }
    @keyframes dcspin { to { transform: rotate(360deg); } }
    .dc-spin { animation: dcspin 0.7s linear infinite; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #0B0C0E; color: #F4F2EE; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; display: flex; flex-direction: column; padding: 60px 24px 28px;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3.4 10.4 12 3.4l8.6 7" stroke="{{ accent }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M5.7 12.1v7a1.5 1.5 0 0 0 1.5 1.5h9.6a1.5 1.5 0 0 0 1.5-1.5v-7" stroke="#F4F2EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M9.8 20.6v-4.2a2.2 2.2 0 0 1 4.4 0v4.2" stroke="#F4F2EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em;">[브랜드명]</span>
  </div>

  <div style="margin-top: 46px;">
    <h1 style="margin: 0; font-size: 33px; font-weight: 700; line-height: 1.22; letter-spacing: -0.035em; text-wrap: pretty;">다시 오셨네요</h1>
    <p style="margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: #8E9299;">예약 내역과 찜해 둔 공간이 그대로 있어요.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; margin-top: 38px;">
    <div style="display: flex; flex-direction: column; gap: 9px;">
      <label for="dc-email" style="font-size: 12px; font-weight: 600; letter-spacing: 0.03em; color: #8E9299;">이메일</label>
      <input id="dc-email" type="email" autocomplete="email" placeholder="you@example.com" value="{{ email }}" onChange="{{ onEmail }}" style="width: 100%; height: 56px; padding: 0 16px; font-size: 15px; color: #F4F2EE; background: #15171B; border: 1px solid {{ emailBorder }}; border-radius: {{ radius }}px;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <label for="dc-pw" style="font-size: 12px; font-weight: 600; letter-spacing: 0.03em; color: #8E9299;">비밀번호</label>
      <div style="position: relative; display: flex;">
        <input id="dc-pw" type="{{ pwType }}" autocomplete="current-password" placeholder="8자 이상" value="{{ pw }}" onChange="{{ onPw }}" style="width: 100%; height: 56px; padding: 0 58px 0 16px; font-size: 15px; color: #F4F2EE; background: #15171B; border: 1px solid {{ pwBorder }}; border-radius: {{ radius }}px;">
        <button type="button" onClick="{{ onToggle }}" aria-label="비밀번호 표시 전환" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border-radius: 10px;">
          <sc-if value="{{ hidePw }}" hint-placeholder-val="{{ true }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z" stroke="#8E9299" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
              <circle cx="12" cy="12" r="3.1" stroke="#8E9299" stroke-width="1.6"></circle>
            </svg>
          </sc-if>
          <sc-if value="{{ showPw }}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 4.4 19.6 20" stroke="{{ accent }}" stroke-width="1.6" stroke-linecap="round"></path>
              <path d="M9.6 6.2A9.6 9.6 0 0 1 12 5.9c6 0 9.5 6.1 9.5 6.1a17 17 0 0 1-3.3 3.9M6.5 8.1A17.5 17.5 0 0 0 2.5 12s3.5 6.1 9.5 6.1a9.4 9.4 0 0 0 3.2-.55" stroke="{{ accent }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M9.9 10a3 3 0 0 0 4.2 4.2" stroke="{{ accent }}" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>
          </sc-if>
        </button>
      </div>
    </div>

    <sc-if value="{{ hasError }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: rgba(255, 122, 90, 0.09); border: 1px solid rgba(255, 122, 90, 0.28); border-radius: 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="#FF7A5A" stroke-width="1.7"></circle>
          <path d="M12 7.6v5.2" stroke="#FF7A5A" stroke-width="1.7" stroke-linecap="round"></path>
          <circle cx="12" cy="16.2" r="0.95" fill="#FF7A5A"></circle>
        </svg>
        <span style="font-size: 13px; line-height: 1.4; color: #FF9A80;">{{ error }}</span>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 20px; height: 44px;">
    <button type="button" onClick="{{ onRemember }}" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0; background: transparent; color: #B9BDC4; font-size: 13.5px;">
      <sc-if value="{{ remember }}" hint-placeholder-val="{{ true }}">
        <span style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: {{ accent }};">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12.6 10 17.4 19 7.4" stroke="#0B0C0E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </span>
      </sc-if>
      <sc-if value="{{ notRemember }}" hint-placeholder-val="{{ false }}">
        <span style="width: 20px; height: 20px; border-radius: 6px; border: 1px solid #3A3E45; background: #15171B;"></span>
      </sc-if>
      <span>로그인 상태 유지</span>
    </button>
    <a href="#" style="font-size: 13.5px; font-weight: 500;">비밀번호 찾기</a>
  </div>

  <button type="button" onClick="{{ onSubmit }}" disabled="{{ btnDisabled }}" style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 56px; margin-top: 22px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: {{ btnColor }}; background: {{ btnBg }}; border-radius: {{ radius }}px;">
    <sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
      <span>로그인</span>
    </sc-if>
    <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
      <span class="dc-spin" style="width: 17px; height: 17px; display: block; border: 2.2px solid rgba(11, 12, 14, 0.28); border-top-color: #0B0C0E; border-radius: 50%;"></span>
      <span>확인 중</span>
    </sc-if>
    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12.6 10 17.4 19 7.4" stroke="#0B0C0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span>로그인 완료</span>
    </sc-if>
  </button>

  <p style="margin: 18px 0 0; font-size: 12.5px; line-height: 1.6; color: #6B7078; text-align: center;">로그인하면 [이용약관]과 [개인정보 처리방침]에 동의하게 됩니다.</p>

  <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: auto; padding-top: 36px; font-size: 14px; color: #8E9299;">
    <span>아직 계정이 없으신가요?</span>
    <a href="#" style="font-weight: 600;">회원가입</a>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB43D","options":["#FFB43D","#7CF0B8","#8AA6FF","#FF7A5A"],"section":"테마"},"radius":{"editor":"range","default":14,"min":0,"max":28,"step":2,"unit":"px","section":"테마"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', pw: '', showPw: false, remember: true, status: 'idle', error: '', field: '' };
  }

  update(key, value) {
    var next = { error: '', field: '' };
    next[key] = value;
    this.setState(next);
  }

  submit() {
    var email = (this.state.email || '').trim();
    var pw = this.state.pw || '';
    var self = this;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      this.setState({ error: '이메일 주소 형식을 확인해 주세요.', field: 'email' });
      return;
    }
    if (pw.length < 8) {
      this.setState({ error: '비밀번호는 8자 이상이어야 해요.', field: 'pw' });
      return;
    }
    this.setState({ status: 'loading', error: '', field: '' });
    setTimeout(function () { self.setState({ status: 'done' }); }, 1100);
  }

  renderVals() {
    var accent = this.props.accent ?? '#FFB43D';
    var radius = this.props.radius ?? 14;
    var s = this.state;
    var filled = (s.email || '').length > 0 && (s.pw || '').length > 0;
    var done = s.status === 'done';
    var self = this;
    return {
      accent: accent,
      radius: radius,
      email: s.email,
      pw: s.pw,
      pwType: s.showPw ? 'text' : 'password',
      showPw: !!s.showPw,
      hidePw: !s.showPw,
      remember: !!s.remember,
      notRemember: !s.remember,
      error: s.error,
      hasError: !!s.error,
      emailBorder: s.field === 'email' ? '#FF7A5A' : '#25282E',
      pwBorder: s.field === 'pw' ? '#FF7A5A' : '#25282E',
      btnBg: done ? '#7CF0B8' : (filled ? accent : '#1C1F24'),
      btnColor: (done || filled) ? '#0B0C0E' : '#565B64',
      btnDisabled: !filled || s.status !== 'idle',
      isIdle: s.status === 'idle',
      isLoading: s.status === 'loading',
      isDone: done,
      onEmail: function (e) { self.update('email', e.target.value); },
      onPw: function (e) { self.update('pw', e.target.value); },
      onToggle: function () { self.setState({ showPw: !self.state.showPw }); },
      onRemember: function () { self.setState({ remember: !self.state.remember }); },
      onSubmit: function () { self.submit(); }
    };
  }
}
</script>
</body>
</html>
