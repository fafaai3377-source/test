<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; background: #0B0C0E; }
    * { box-sizing: border-box; }
    a { color: #FFB43D; text-decoration: none; }
    a:hover { color: #FFCE7A; }
  </style>
</helmet>
<div style="width: 880px; min-height: 760px; background: #0B0C0E; color: #F4F2EE; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; padding: 48px 44px; display: flex; flex-direction: column; gap: 34px;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #FFB43D;">STATES</span>
    <h2 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.03em;">입력 필드와 버튼 상태</h2>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px;">

    <div style="display: flex; flex-direction: column; gap: 24px;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #6B7078;">입력 필드 · 56px</span>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; color: #8E9299;">기본</span>
        <div style="height: 56px; display: flex; align-items: center; padding: 0 16px; font-size: 15px; color: #565B64; background: #15171B; border: 1px solid #25282E; border-radius: 14px;">you@example.com</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; color: #8E9299;">입력됨</span>
        <div style="height: 56px; display: flex; align-items: center; padding: 0 16px; font-size: 15px; color: #F4F2EE; background: #15171B; border: 1px solid #25282E; border-radius: 14px;">jiwoo@stayletter.kr</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; color: #8E9299;">포커스</span>
        <div style="height: 56px; display: flex; align-items: center; padding: 0 16px; font-size: 15px; color: #F4F2EE; background: #15171B; border: 1px solid #25282E; border-radius: 14px; box-shadow: 0 0 0 3px rgba(255, 180, 61, 0.16);">jiwoo@stayletter.kr</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; color: #8E9299;">오류</span>
        <div style="height: 56px; display: flex; align-items: center; padding: 0 16px; font-size: 15px; color: #F4F2EE; background: #15171B; border: 1px solid #FF7A5A; border-radius: 14px;">jiwoo@stayletter</div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: rgba(255, 122, 90, 0.09); border: 1px solid rgba(255, 122, 90, 0.28); border-radius: 12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="#FF7A5A" stroke-width="1.7"></circle>
            <path d="M12 7.6v5.2" stroke="#FF7A5A" stroke-width="1.7" stroke-linecap="round"></path>
            <circle cx="12" cy="16.2" r="0.95" fill="#FF7A5A"></circle>
          </svg>
          <span style="font-size: 13px; color: #FF9A80;">이메일 주소 형식을 확인해 주세요.</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 24px;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #6B7078;">기본 버튼 · 56px</span>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; color: #8E9299;">비활성 — 두 칸이 모두 채워지기 전</span>
        <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #565B64; background: #1C1F24; border-radius: 14px;">로그인</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; color: #8E9299;">활성</span>
        <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #0B0C0E; background: #FFB43D; border-radius: 14px;">로그인</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; color: #8E9299;">확인 중</span>
        <div style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 16px; font-weight: 700; color: #0B0C0E; background: #FFB43D; border-radius: 14px;">
          <span style="width: 17px; height: 17px; display: block; border: 2.2px solid rgba(11, 12, 14, 0.28); border-top-color: #0B0C0E; border-radius: 50%;"></span>
          <span>확인 중</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; color: #8E9299;">완료</span>
        <div style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 16px; font-weight: 700; color: #0B0C0E; background: #7CF0B8; border-radius: 14px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12.6 10 17.4 19 7.4" stroke="#0B0C0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span>로그인 완료</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; margin-top: 4px;">
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #FFB43D;"></span>
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #7CF0B8;"></span>
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #FF7A5A;"></span>
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #15171B; border: 1px solid #25282E;"></span>
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #0B0C0E; border: 1px solid #25282E;"></span>
        <span style="font-size: 12px; color: #6B7078;">accent · success · error · surface · base</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
